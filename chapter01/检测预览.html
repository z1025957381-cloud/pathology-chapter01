<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>第一章｜细胞和组织的适应与损伤</title><style>
:root {
  --canvas: #e8e7e1;
  --paper: #fbf8f0;
  --paper-2: #f4f0e6;
  --ink: #20332d;
  --muted: #6f7c75;
  --faint: #9aa39e;
  --line: #cbd1cc;
  --green: #275b4b;
  --green-soft: #dce9e2;
  --green-pale: #edf4f0;
  --amber: #9b6a2b;
  --amber-soft: #f3eadc;
  --shadow: rgba(36, 50, 44, .13);
}

* { box-sizing: border-box; }
html { min-width: 320px; background: var(--canvas); color: var(--ink); }
body {
  margin: 0;
  min-width: 320px;
  min-height: 100dvh;
  background:
    radial-gradient(circle at 12% 5%, rgba(255,255,255,.76), transparent 34rem),
    var(--canvas);
  font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  text-rendering: optimizeLegibility;
}
button { font: inherit; }
button:focus-visible { outline: 2px solid rgba(39,91,75,.55); outline-offset: 3px; }

.course-shell {
  display: grid;
  grid-template-columns: minmax(300px, 470px) 420px;
  align-items: center;
  justify-content: center;
  gap: clamp(50px, 8vw, 140px);
  min-height: 100dvh;
  padding: 24px 40px;
}

.course-desktop-intro { align-self: center; max-width: 470px; }
.course-desktop-intro > p {
  margin: 0 0 18px;
  color: var(--green);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .16em;
}
.course-desktop-intro h1 {
  margin: 0;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  font-size: clamp(42px, 5vw, 68px);
  line-height: 1.16;
  letter-spacing: -.035em;
}
.course-desktop-intro > span {
  display: block;
  max-width: 420px;
  margin-top: 24px;
  color: var(--muted);
  font-size: 16px;
  line-height: 1.8;
}
.course-desktop-intro dl {
  display: flex;
  gap: 28px;
  margin: 42px 0 0;
  padding-top: 22px;
  border-top: 1px solid rgba(71,86,78,.22);
}
.course-desktop-intro dl div { display: grid; gap: 4px; }
.course-desktop-intro dt { color: var(--muted); font-size: 12px; }
.course-desktop-intro dd { margin: 0; color: var(--green); font-family: Georgia, serif; font-size: 30px; }

.course-phone {
  position: relative;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  width: 420px;
  height: min(890px, calc(100dvh - 48px));
  min-height: 680px;
  overflow: hidden;
  border: 1px solid rgba(43,66,56,.13);
  border-radius: 32px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,0) 18%),
    var(--paper);
  box-shadow: 0 28px 78px var(--shadow), 0 2px 8px rgba(36,50,44,.06);
}

.course-header {
  position: relative;
  z-index: 20;
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  min-height: 92px;
  padding: 20px 22px 15px;
  background: linear-gradient(180deg, rgba(251,248,240,.98), rgba(251,248,240,.9));
}
.course-header > button,
.course-header-actions > button {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--green);
  cursor: pointer;
}
.course-header svg { width: 20px; height: 20px; }
.course-header > div:nth-child(2) { min-width: 0; }
.course-header small {
  display: block;
  margin-bottom: 3px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .08em;
}
.course-header strong {
  display: block;
  overflow: hidden;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  font-size: 15px;
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.course-header-actions { display: flex; align-items: center; gap: 3px; }
.course-header-actions > span { color: var(--faint); font-family: Georgia, serif; font-size: 12px; }
.course-header-actions .course-retry-entry { width: auto; min-width: 48px; padding: 0 6px; font-size: 13px; font-weight: 650; white-space: nowrap; }

.course-viewport {
  position: relative;
  min-height: 0;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.course-footer {
  position: relative;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 26px;
  padding: 4px 16px max(4px, env(safe-area-inset-bottom));
  background: var(--paper);
}
.course-footer > span { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); }
.course-footer p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.4; white-space: nowrap; }

.stage-enter { animation: stage-enter .32s cubic-bezier(.2,.72,.24,1) both; }
@keyframes stage-enter {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Directory layer */
.directory-page {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  padding: 26px 30px 18px 34px;
  overflow-y: auto;
  /* Declare on the scroll container itself so touch swipes reach our handler. */
  touch-action: none;
  scrollbar-width: none;
}
.directory-page::-webkit-scrollbar { display: none; }
.directory-heading { flex: 0 0 auto; }
.directory-heading > small {
  display: block;
  color: var(--green);
  font-size: 11px;
  font-weight: 850;
  letter-spacing: .12em;
}
.directory-heading h1 {
  margin: 9px 0 0;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  font-size: 30px;
  line-height: 1.28;
  letter-spacing: -.02em;
}
.directory-heading > p:not(.previous-section-note) { margin: 11px 0 0; color: var(--muted); font-size: 12px; }
.previous-section-note {
  width: fit-content;
  margin: 0 0 18px;
  padding: 7px 10px;
  border-radius: 999px;
  background: var(--green-pale);
  color: var(--green);
  font-size: 10px;
  line-height: 1.4;
}
.chapter-tree,
.section-item-tree {
  --directory-node-size: 20px;
  --directory-node-border: 3px;
  --directory-node-color: #15666a;
  --directory-link-color: #b8c2bc;
  position: relative;
  display: grid;
  align-content: center;
  flex: 1 0 auto;
  min-height: 350px;
  margin-top: 20px;
}
.directory-rail {
  display: none;
}
.section-item-tree {
  --directory-node-size: 18px;
  --directory-node-border: 2.5px;
  --directory-link-color: #bdc7c1;
}
.chapter-section-row,
.section-item-row {
  position: relative;
  display: grid;
  grid-template-columns: var(--directory-node-size) minmax(0, 1fr) 20px;
  align-items: center;
  gap: calc(31px - var(--directory-node-size));
  min-height: 70px;
  padding: 7px 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}
.chapter-section-row::before,
.chapter-section-row::after,
.section-item-row::before,
.section-item-row::after {
  content: "";
  position: absolute;
  z-index: 0;
  left: calc((var(--directory-node-size) - 1px) / 2);
  width: 1px;
  background: var(--directory-link-color);
  pointer-events: none;
}
.chapter-section-row::before,
.section-item-row::before { top: 0; bottom: 50%; }
.chapter-section-row::after,
.section-item-row::after { top: 50%; bottom: 0; }
.chapter-section-row:first-of-type::before,
.section-item-row:first-of-type::before,
.chapter-section-row:last-of-type::after,
.section-item-row:last-of-type::after { display: none; }
.chapter-section-row:disabled { cursor: default; pointer-events: none; }
.chapter-section-row:disabled > * { opacity: .42; }
.chapter-section-row > span:nth-child(2),
.section-item-row > span:nth-child(2) { min-width: 0; }
.chapter-section-row > span:nth-child(2) > small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.2;
}
.chapter-section-row strong,
.section-item-row strong {
  display: block;
  margin-top: 3px;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  font-size: 17px;
  line-height: 1.35;
}
.chapter-section-row em,
.section-item-row small {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 10px;
  font-style: normal;
}
.chapter-section-row > svg,
.section-item-row > svg { width: 16px; color: var(--faint); opacity: .55; }
.chapter-section-row.is-active strong,
.section-item-row.is-active strong { color: var(--green); font-size: 19px; }
.chapter-section-row.is-active > svg,
.section-item-row.is-active > svg { color: var(--green); opacity: 1; }

.course-progress-dot {
  position: relative;
  z-index: 2;
  display: block;
  width: var(--directory-node-size);
  height: var(--directory-node-size);
  border: var(--directory-node-border) solid var(--directory-node-color);
  border-radius: 50%;
  background: var(--paper);
  transition: background .3s ease, box-shadow .3s ease;
}
.course-progress-dot.is-started { background: linear-gradient(to top, var(--directory-node-color) 50%, var(--paper) 50%); }
.course-progress-dot.is-complete { border-color: #6b8f83; background: #6b8f83; }
.course-progress-dot.is-pending::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--directory-node-color); }
.course-progress-dot.is-review { border-color: var(--amber); }
.course-progress-dot.is-review::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--amber); }
.course-progress-dot.is-unavailable { border-style: dashed; background: var(--paper-2); }
.course-progress-dot.is-active { border-color: var(--directory-node-color); background: var(--directory-node-color); box-shadow: 0 0 0 5px rgba(21,102,106,.12); }
.course-progress-dot.is-active::after { display: none; }
.course-progress-dot.is-active.is-complete { border-color: #6b8f83; background: #6b8f83; box-shadow: 0 0 0 5px rgba(75,123,106,.13); }

.directory-primary-actions { display: grid; justify-items: center; gap: 10px; flex: 0 0 auto; padding-top: 14px; }
.primary-course-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  width: 100%;
  min-height: 50px;
  padding: 0 18px;
  border: 0;
  border-radius: 16px;
  background: var(--green);
  color: #fff;
  font-weight: 750;
  cursor: pointer;
}
.primary-course-button svg { width: 17px; }
.text-course-button {
  min-height: 34px;
  padding: 0 12px;
  border: 0;
  background: transparent;
  color: var(--green);
  font-size: 12px;
  font-weight: 750;
  cursor: pointer;
}

/* Knowledge layer */
.knowledge-page {
  position: relative;
  width: 100%;
  height: 100%;
  padding: 24px 30px 22px 42px;
  overflow: hidden;
}
.knowledge-path {
  position: absolute;
  top: 8px;
  left: 42px;
  z-index: 3;
  margin: 0;
  color: var(--green);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .04em;
}
.knowledge-history {
  position: absolute;
  top: 42px;
  right: 34px;
  left: 42px;
  z-index: 1;
  display: grid;
  gap: 9px;
  max-height: 132px;
  overflow: hidden;
}
.knowledge-history p {
  margin: 0;
  color: var(--muted);
  font-size: calc(13.5px - (var(--history-depth) - 1) * .8px);
  line-height: 1.45;
  opacity: calc(.66 - (var(--history-depth) - 1) * .18);
  transform: scale(calc(1 - (var(--history-depth) - 1) * .05));
  transform-origin: left top;
}
.current-knowledge {
  position: absolute;
  top: 50%;
  right: 30px;
  left: 42px;
  z-index: 2;
  max-height: 62%;
  padding: 8px 4px 18px 0;
  overflow-y: auto;
  scrollbar-width: thin;
  overscroll-behavior: contain;
  transform: translateY(-47%);
  user-select: text;
  -webkit-user-select: text;
}
.current-knowledge > small,
.question-heading > small {
  color: var(--green);
  font-size: 10px;
  font-weight: 850;
  letter-spacing: .1em;
}
.current-knowledge h2,
.question-heading h2 {
  margin: 10px 0 0;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  font-size: 25px;
  line-height: 1.35;
  letter-spacing: -.015em;
}
.approved-prose-body,
.approved-relation-body,
.approved-comparison-body { margin-top: 24px; }
.approved-prose-body p {
  margin: 0 0 13px;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  font-size: 19px;
  font-weight: 600;
  line-height: 1.72;
}
.approved-relation-body { display: grid; gap: 18px; }
.approved-relation-body > div {
  position: relative;
  display: grid;
  grid-template-columns: 12px minmax(0, 1fr);
  gap: 13px;
  align-items: start;
}
.approved-relation-body > div > span {
  width: 9px;
  height: 9px;
  margin-top: 9px;
  border: 1.5px solid var(--green);
  border-radius: 50%;
  background: var(--paper);
}
.approved-relation-body > div:not(:last-child)::after {
  content: "";
  position: absolute;
  top: 19px;
  bottom: -17px;
  left: 4px;
  width: 1px;
  background: var(--line);
}
.approved-relation-body p,
.approved-comparison-body p {
  margin: 0;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  font-size: 18px;
  font-weight: 600;
  line-height: 1.68;
}
.approved-comparison-body { display: grid; gap: 13px; }
.approved-comparison-body p {
  padding: 14px 0;
  border-top: 1px solid var(--line);
}
.approved-comparison-body p:last-child { border-bottom: 1px solid var(--line); }
.support-entry {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 38px;
  margin-top: 24px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--green);
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}
.support-entry svg { width: 16px; }

/* Question layer */
.question-stage {
  position: absolute;
  top: 50%;
  right: 28px;
  left: 42px;
  z-index: 2;
  max-height: 72%;
  padding: 8px 5px 22px 0;
  overflow-y: auto;
  scrollbar-width: thin;
  overscroll-behavior: contain;
  transform: translateY(-46%);
  user-select: none;
}
.question-heading h2 { font-size: 21px; line-height: 1.48; }
.question-heading > p { margin: 11px 0 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
.question-target-list,
.single-choice-list,
.comparison-answer-grid { display: grid; gap: 9px; margin-top: 22px; }
.question-target,
.single-choice-list > button {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 18px;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 55px;
  padding: 10px 13px;
  border: 1px solid rgba(75,93,84,.18);
  border-radius: 14px;
  background: rgba(255,255,255,.46);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}
.question-target > span { color: var(--muted); font-size: 11px; line-height: 1.35; }
.question-target > strong { max-width: 155px; color: var(--green); font-size: 12px; line-height: 1.4; text-align: right; }
.question-target > svg { width: 15px; color: var(--faint); }
.question-target.is-filled { border-color: rgba(39,91,75,.42); background: var(--green-pale); }
.question-target.is-correct { border-color: var(--green); }
.question-target.is-review { border-color: rgba(155,106,43,.55); background: var(--amber-soft); }
.comparison-answer-grid { gap: 13px; }
.comparison-answer-grid article {
  padding: 13px 12px 4px;
  border-top: 1px solid var(--line);
}
.comparison-answer-grid h3 {
  margin: 0 0 10px;
  color: var(--green);
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  font-size: 15px;
}
.comparison-answer-grid .question-target { margin-bottom: 8px; }
.single-choice-list > button { grid-template-columns: 30px minmax(0, 1fr) 18px; }
.single-choice-list > button > span {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--muted);
  font-family: Georgia, serif;
  font-size: 12px;
}
.single-choice-list > button > strong { font-size: 13px; line-height: 1.45; }
.single-choice-list > button > svg { width: 17px; color: var(--green); }
.single-choice-list > button.is-selected { border-color: var(--green); background: var(--green-pale); }
.single-choice-list > button.is-answer > span { border-color: var(--green); background: var(--green); color: #fff; }
.question-actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.question-submit {
  flex: 1;
  min-height: 46px;
  border: 0;
  border-radius: 14px;
  background: var(--green);
  color: white;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
}
.question-submit:disabled { cursor: default; opacity: .32; }
.question-reset {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 46px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: transparent;
  color: var(--green);
  font-size: 13px;
  cursor: pointer;
}
.question-reset svg { width: 14px; }
.question-reset:disabled { opacity: .45; cursor: default; }
.question-feedback {
  margin-top: 14px;
  padding: 14px 15px;
  border-left: 3px solid var(--green);
  border-radius: 4px 12px 12px 4px;
  background: var(--green-pale);
}
.question-feedback.is-review { border-left-color: var(--amber); background: var(--amber-soft); }
.question-feedback > strong { color: var(--green); font-size: 11px; }
.question-feedback.is-review > strong { color: var(--amber); }
.question-feedback p { margin: 7px 0 0; color: #52635b; font-size: 12px; line-height: 1.6; }
.question-feedback .answer-line { color: var(--ink); font-weight: 750; }

/* Completion */
.completion-page {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  padding: 38px 38px 30px;
  text-align: center;
}
.completion-orbit {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  margin-bottom: 19px;
  border: 1px solid var(--green);
  border-radius: 50%;
  box-shadow: 0 0 0 8px var(--green-soft);
}
.completion-orbit span { width: 13px; height: 13px; border-radius: 50%; background: var(--green); }
.completion-spark { width: 42px; height: 42px; margin-bottom: 18px; color: var(--green); }
.completion-page > small { color: var(--green); font-size: 10px; font-weight: 850; letter-spacing: .12em; }
.completion-page h1 { margin: 12px 0 0; font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif; font-size: 28px; }
.completion-page > p { max-width: 300px; margin: 13px 0 0; color: var(--muted); font-size: 13px; line-height: 1.72; }
.completion-page dl { display: flex; gap: 40px; margin: 30px 0 26px; }
.completion-page dl div { display: grid; gap: 5px; }
.completion-page dt { color: var(--muted); font-size: 10px; }
.completion-page dd { margin: 0; color: var(--green); font-family: Georgia, serif; font-size: 25px; }
.completion-page .primary-course-button { max-width: 290px; }
.completion-page .text-course-button { margin-top: 8px; }

/* Bottom sheets */
.course-sheet-layer {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
  touch-action: pan-y;
}
.course-sheet-backdrop {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  background: rgba(31,47,40,.22);
  backdrop-filter: blur(2px);
}
.course-sheet {
  position: relative;
  z-index: 1;
  width: 100%;
  max-height: 78%;
  padding: 18px 20px max(22px, env(safe-area-inset-bottom));
  border-radius: 24px 24px 0 0;
  background: #fdfaf2;
  box-shadow: 0 -18px 50px rgba(35,50,43,.18);
  animation: sheet-enter .26s ease both;
}
@keyframes sheet-enter { from { transform: translateY(100%); } to { transform: translateY(0); } }
.course-sheet header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 38px;
  align-items: start;
  gap: 12px;
  margin-bottom: 14px;
}
.course-sheet header small { color: var(--green); font-size: 10px; font-weight: 800; }
.course-sheet header h3 { margin: 5px 0 0; font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif; font-size: 19px; line-height: 1.35; }
.course-sheet header > button {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--green);
  cursor: pointer;
}
.course-sheet header svg { width: 18px; }
.course-option-list {
  display: grid;
  gap: 8px;
  max-height: 430px;
  overflow-y: auto;

 * user-requested typography derivative. No historical override sheet is loaded.
 */
* { box-sizing: border-box; }
:root { color-scheme: light; }
body { margin: 0; background: #f2f0e7; color: #233b34; font-family: system-ui, -apple-system, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif; }
body[data-theme=&#x27;dark&#x27;] { color-scheme: dark; background: #151a17; color: #e5e9df; }
button, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
:focus-visible { outline: 2px solid #5b816d; outline-offset: 3px; }
.review-shell { width: 100%; max-width: 520px; margin: 0 auto; padding: 8px 12px; }
.review-controls { display: flex; align-items: center; gap: 8px; height: 48px; margin: 0 auto 8px; max-width: var(--preview-width,390px); font-size: 13px; }
.review-controls select { flex: 1; width: 0; min-width: 0; }
.review-controls button, .review-controls select { min-height: 44px; border: 1px solid #d7d8cc; border-radius: 8px; color: inherit; background: #fffef8; padding: 8px; }
body[data-theme=&#x27;dark&#x27;] .review-controls button, body[data-theme=&#x27;dark&#x27;] .review-controls select { background: #202722; border-color: #465346; }
.review-details { max-width: var(--preview-width,390px); margin: 12px auto 0; font-size: 12px; line-height: 1.7; }
.review-details summary { cursor: pointer; }
.review-details code { overflow-wrap: anywhere; }
#course-layout-templates { width: 100%; }
.course-phone {
  --paper: #faf8ef; --ink: #233b34; --quiet: #626e61; --em: #28624f;
  --rule: #dfdfd0; --table-rule: #6f8979;
  width: min(100%, var(--preview-width,390px));
  height: var(--phone-height,calc(100dvh - 80px));
  min-height: 0; margin-inline: auto;
  border: 1px solid var(--rule); border-radius: 16px;
  background: var(--paper); color: var(--ink);
  display: flex; flex-direction: column;
  font-family: &#x27;Noto Serif SC&#x27;,&#x27;Noto Serif CJK SC&#x27;,&#x27;Songti SC&#x27;,SimSun,serif;
  font-weight: var(--regular-weight); letter-spacing: 0;
  font-size: var(--body-size); line-height: var(--leading);
}
#course-layout-templates[data-theme=&#x27;dark&#x27;] .course-phone {
  --paper: #202722; --ink: #e5e9df; --quiet: #b8c0b3; --em: #a0c9b0;
  --rule: #465346; --table-rule: #7c9782;
}
.course-phone[data-density=&#x27;compact&#x27;] { --body-size: var(--compact-size); --leading: var(--compact-leading); }
.course-stage {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  justify-content: center; padding: var(--stage-block) var(--stage-inline);
}
.course-current { flex: 0 0 auto; min-width: 0; width: 100%; }
.course-head { margin: 0 0 var(--title-gap); padding: 0; text-align: left; }
.course-title { display: block; margin: 0; font-size: var(--title-size); line-height: var(--title-leading); font-weight: var(--emphasis-weight); letter-spacing: 0; }
.title-parent { display: block; margin: 0 0 var(--context-gap); font-size: var(--context-size); line-height: var(--heading-leading); font-weight: var(--regular-weight); color: var(--quiet); }
.title-current { display: block; text-align: left; text-wrap: wrap; word-break: normal; line-break: strict; }
.title-alias { display: block; font-size: var(--context-size); line-height: var(--heading-leading); font-weight: var(--regular-weight); margin-top: 6px; }
.course-reading { margin: 0; padding: 0; min-width: 0; }
.course-copy {
  width: 100%; min-width: 0; text-align: left;
  font-size: var(--body-size); line-height: var(--leading);
  font-weight: var(--regular-weight); letter-spacing: 0;
  word-break: normal; overflow-wrap: break-word; line-break: strict;
}
.course-copy :where(p,ul,ol,dl,dd,dt,h2,section) { margin: 0; padding: 0; }
.course-copy :where(p,dd,.fact-body,.fact-line,li) { text-indent: 0; text-wrap: pretty; }
.course-copy strong { display: inline; font-weight: var(--emphasis-weight); color: var(--em); white-space: normal; }
.course-copy .keep-term { display: inline; white-space: normal; }
.course-copy [data-role=&#x27;group-heading&#x27;] {
  display: block; margin: 0 0 var(--heading-gap);
  font-size: 1em; line-height: var(--heading-leading);
  font-weight: var(--emphasis-weight); color: var(--ink);
  text-align: left; text-indent: 0; text-wrap: pretty;
}
.course-copy section + section { margin-top: var(--group-gap); }
.course-copy p + p { margin-top: var(--paragraph-gap); }
.course-copy .items { display: grid; list-style: none; gap: var(--item-gap); }
.course-copy .intro { margin-bottom: var(--paragraph-gap); }
.course-copy .brief-facts { gap: var(--group-gap); }
.course-copy .fact-body { display: block; }
.course-copy .fact-body + .fact-body { margin-top: var(--item-gap); }
.course-copy .fact-list { display: grid; gap: var(--group-gap); }
.course-copy section .fact-list { gap: var(--subgroup-gap); }
.course-copy .fact-list &gt; div { min-width: 0; }
.course-copy .fact-list dd + dd { margin-top: var(--item-gap); }
.course-copy .stage-list { display: grid; list-style: none; gap: var(--group-gap); }
.course-copy .stage-result, .course-copy .rule-takeaway { margin-top: var(--group-gap); }
.course-copy .sequence { list-style: none; text-align: center; }
.course-copy .sequence li { text-wrap: pretty; }
.course-copy .sequence li + li::before { content: &#x27;↓&#x27;; display: block; color: var(--quiet); font-size: 18px; line-height: 1.4; margin: 6px 0; }
.course-copy .compare + .compare { border-top: 1px solid var(--rule); margin-top: calc((var(--group-gap) - 1px) / 2); padding-top: calc((var(--group-gap) - 1px) / 2); }
.course-copy .site-items { grid-template-columns: repeat(2,minmax(0,1fr)); column-gap: 16px; }
.course-copy .site-items li { padding-left: .65em; position: relative; }
.course-copy .site-items li::before { content: &#x27;·&#x27;; position: absolute; left: 0; color: var(--quiet); }
.course-copy .compare-table {
  width: 100%; table-layout: fixed; border-collapse: collapse;
  border-top: 2px solid var(--table-rule); border-bottom: 2px solid var(--table-rule);
  font: inherit; color: var(--ink);
}
.course-copy .compare-table col:first-child { width: var(--table-key-width); }
.course-copy .compare-table :where(th,td) {
  border: 0; padding: var(--table-pad) var(--cell-inline);
  font: inherit; text-align: left; vertical-align: top;
  background: transparent; word-break: normal; overflow-wrap: break-word; line-break: strict; text-wrap: pretty;
}
.course-copy .compare-table thead th { border-bottom: 1px solid var(--table-rule); font-weight: var(--emphasis-weight); text-align: center; vertical-align: middle; }
.course-copy .compare-table tbody th { font-weight: var(--emphasis-weight); }
.course-copy .compare-table th .dimension-label-fragment { display: block; white-space: normal; }
.course-copy .compare-table p + p { margin-top: var(--item-gap); }
.course-copy .compare-table td.short-value { text-align: center; }
.course-copy .topic { font: inherit; font-weight: var(--emphasis-weight); }
.course-phone[data-template=&#x27;overview&#x27;] .course-head,
.course-phone[data-template=&#x27;overview&#x27;] .title-current,
.course-phone[data-template=&#x27;overview&#x27;] .course-copy,
.course-phone[data-template=&#x27;overview&#x27;] [data-role=&#x27;group-heading&#x27;],
.course-phone[data-template=&#x27;completion&#x27;] .course-head,
.course-phone[data-template=&#x27;completion&#x27;] .title-current,
.course-phone[data-template=&#x27;completion&#x27;] .course-copy { text-align: center; }
.course-copy .completion { display: grid; gap: var(--group-gap); justify-items: center; text-align: center; }
.course-copy .completion .celebrate { font-size: var(--title-size); font-weight: var(--emphasis-weight); }
.course-footer {
  flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
  min-height: 68px; padding: 10px 20px 14px; gap: 8px;
  color: var(--quiet); font: 13px/1.4 system-ui,sans-serif;
}
.course-footer button { min-height: 44px; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 6px; color: inherit; background: transparent; }
.footer-center { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.course-footer .full-table-button { padding: 0 8px; border: 0; min-height: 44px; text-decoration: underline; text-underline-offset: 3px; }
.course-phone[data-presentation=&#x27;summary&#x27;] { height: auto; min-height: var(--phone-height); }
.course-phone[data-presentation=&#x27;summary&#x27;] .course-stage { justify-content: flex-start; flex: none; }
.course-phone[data-presentation=&#x27;summary&#x27;] .course-footer { position: static; background: var(--paper); border-top: 1px solid var(--rule); }
.course-phone[data-presentation=&#x27;summary&#x27;] .course-head { text-align: left; }
@media(max-width:454px) {
  .review-shell { padding-inline: 0; }
  .review-controls { padding-inline: 10px; }
  .review-details { padding-inline: 12px; }
  .course-phone { border-radius: 0; border-left: 0; border-right: 0; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
&lt;/style&gt;&lt;style&gt;
/* relation-layout 1.3 — one shared extension; original baseline CSS is unchanged.
 * Short rules mark peer topics only. Attribute labels stay inside their object.
 * Every selector is structural; no chapter/page ID selectors or inline overrides.
 */
.course-copy [data-relation-layout] { display:block; }
.course-copy [data-relation-layout] &gt; section + section { margin-top:22px; }
.course-copy [data-relation-layout] &gt; section[data-boundary=&#x27;short&#x27;] { margin-top:20px; padding-top:20px; position:relative; }
.course-copy [data-relation-layout] &gt; section[data-boundary=&#x27;short&#x27;]::before { content:&#x27;&#x27;; position:absolute; left:0; top:0; width:56px; height:1px; background:var(--table-rule); opacity:.5; }
.course-copy [data-relation-layout] [data-role=&#x27;group-heading&#x27;] { margin-bottom:9px; }
.course-copy [data-relation-layout] [data-heading-kind=&#x27;attribute&#x27;] { font-size:17px; line-height:1.45; color:var(--quiet); font-weight:500; margin-bottom:6px; }
.course-copy [data-relation-layout] p + p { margin-top:10px; }
.course-copy [data-reading-unit] + [data-reading-unit] { margin-top:12px; }
.course-copy [data-reading-unit=&#x27;points&#x27;] { gap:9px; }
.course-copy [data-reading-unit=&#x27;points&#x27;] &gt; li { position:relative; padding-left:.7em; }
.course-copy [data-reading-unit=&#x27;points&#x27;] &gt; li::before { content:&#x27;·&#x27;; position:absolute; left:0; color:var(--quiet); font-weight:600; }
.course-copy [data-role=&#x27;attribute-label&#x27;] { display:block; font-size:17px; line-height:1.45; color:var(--quiet); margin-bottom:3px; font-weight:500; }
.course-copy [data-reading-unit=&#x27;field&#x27;] + [data-reading-unit=&#x27;field&#x27;] { margin-top:11px; }
.course-copy [data-reading-unit=&#x27;subordinate&#x27;] { padding-left:.65em; border-left:1px solid var(--rule); margin-top:8px; }
.course-copy [data-reading-unit=&#x27;subordinate&#x27;] p { margin-top:0; }
.course-copy [data-reading-unit=&#x27;flow&#x27;] { text-align:left; }
.course-copy [data-reading-unit=&#x27;flow&#x27;] &gt; p { margin:0; text-indent:0; }
.course-copy [data-reading-unit=&#x27;flow&#x27;] &gt; [data-flow-part=&#x27;connector&#x27;] { width:1em; height:18px; font-size:18px; line-height:18px; margin:5px 0 5px .2em; transform:rotate(90deg); transform-origin:center; color:var(--quiet); text-align:center; white-space:nowrap; }
.course-copy [data-relation-layout=&#x27;timeline&#x27;] { padding-left:13px; }
.course-copy [data-relation-layout=&#x27;timeline&#x27;] &gt; section { position:relative; padding-left:14px; border-left:1px solid var(--rule); }
.course-copy [data-relation-layout=&#x27;timeline&#x27;] &gt; section::before { content:&#x27;&#x27;; width:5px; height:5px; border:1px solid var(--table-rule); border-radius:50%; background:var(--paper); position:absolute; left:-4px; top:.55em; }
.course-copy [data-relation-layout=&#x27;timeline&#x27;] &gt; section + section { margin-top:0; padding-top:16px; }
.course-copy [data-relation-layout=&#x27;timeline&#x27;] &gt; section + section::before { top:calc(16px + .55em); }
.course-copy [data-relation-layout=&#x27;timeline&#x27;] [data-role=&#x27;group-heading&#x27;] { margin-bottom:4px; }
/* Original short diagnostic comparisons retain their object/dimension bindings. */
.course-phone[data-presentation=&#x27;page&#x27;] .course-copy .compare + .compare { border-top:0; padding-top:20px; margin-top:20px; position:relative; }
.course-phone[data-presentation=&#x27;page&#x27;] .course-copy .compare + .compare::before { content:&#x27;&#x27;; position:absolute; top:0; left:0; width:56px; height:1px; background:var(--table-rule); opacity:.5; }

/* Structural companions to approved R13. No chapter, page-ID, or per-page overrides. */
.course-copy [data-reading-unit=&quot;bound-field&quot;] + [data-reading-unit=&quot;bound-field&quot;] {margin-top:11px;}
.course-copy [data-role=&quot;attribute-inline&quot;] {font-size:17px;line-height:1.5;font-weight:500;color:var(--quiet);}
.course-copy [data-relation-layout] [data-reading-unit=&quot;paragraph&quot;] + [data-reading-unit=&quot;points&quot;] {margin-top:10px;}
.course-copy [data-reading-unit=&quot;flow&quot;] + [data-reading-unit=&quot;paragraph&quot;] {margin-top:10px;}
.course-copy [data-relation-layout=&quot;ordered&quot;] {padding-left:13px;}
.course-copy [data-relation-layout=&quot;ordered&quot;] &gt; section {padding-left:12px;border-left:1px solid var(--rule);}
.course-copy [data-relation-layout=&quot;ordered&quot;] &gt; section + section {margin-top:16px;}
.course-copy [data-role=&quot;attribute-block&quot;] {display:block;font-size:17px;line-height:1.45;color:var(--quiet);font-weight:500;margin-bottom:3px;}

.course-copy [data-reading-unit=&quot;intro&quot;] + [data-relation-layout] {margin-top:14px;}

swer":"液化性坏死"},{"prompt":"金黄色葡萄球菌感染性脓肿","answer":"液化性坏死"},{"prompt":"结核病灶","answer":"干酪样坏死"},{"prompt":"急性胰腺炎时胰周脂肪组织","answer":"脂肪坏死"},{"prompt":"结节性多动脉炎血管壁","answer":"纤维蛋白样坏死"}],"options":["凝固性坏死","液化性坏死","干酪样坏死","脂肪坏死","纤维蛋白样坏死"],"mode":"category"},"answer_text":"心肌梗死 → 凝固性坏死\n脑梗死 → 液化性坏死\n金黄色葡萄球菌感染性脓肿 → 液化性坏死\n结核病灶 → 干酪样坏死\n急性胰腺炎时胰周脂肪组织 → 脂肪坏死\n结节性多动脉炎血管壁 → 纤维蛋白样坏死","stage":"章末"},"repair_class":"审核汇总调整","sources":[{"file":"01 病理学（细胞和组织的适应与损伤）_精简版.md","line":157,"text":"    - 发生条件与机制：蛋白质变性凝固较显著，而溶酶体酶水解作用较弱。 ★★★。","stars":3},{"file":"01 病理学（细胞和组织的适应与损伤）_精简版.md","line":158,"text":"    - 镜下形态与常见部位：**坏死区原有组织轮廓仍可保存，常见于心、肝、肾、脾等实质器官。** ★★★★","stars":4},{"file":"01 病理学（细胞和组织的适应与损伤）_精简版.md","line":162,"text":"    - 基本形态：**坏死组织被酶性消化后液化，形成软化灶或囊腔。** ★★★★","stars":4},{"file":"01 病理学（细胞和组织的适应与损伤）_精简版.md","line":164,"text":"    - 感染相关病变：**化脓性炎形成的脓肿属于液化性坏死；阿米巴肝脓肿的坏死物也呈液化。** ★★★★","stars":4},{"file":"01 病理学（细胞和组织的适应与损伤）_精简版.md","line":167,"text":"    - 分类归属：**干酪样坏死是坏死更为彻底的特殊类型凝固性坏死。** ★★★★","stars":4},{"file":"01 病理学（细胞和组织的适应与损伤）_精简版.md","line":168,"text":"    - 特征与形态：**是结核病的特征性坏死。病灶因含脂质较多而呈黄色、状似干酪；镜下呈无结构、嗜酸性颗粒状物，原有组织轮廓及核碎屑消失。** ★★★★","stars":4},{"file":"01 病理学（细胞和组织的适应与损伤）_精简版.md","line":173,"text":"    - 病变部位区分：**急性出血坏死性胰腺炎时，胰腺实质可发生凝固性坏死，胰腺周围脂肪组织发生脂肪坏死。** ★★★★","stars":4},{"file":"01 病理学（细胞和组织的适应与损伤）_精简版.md","line":174,"text":"    - 皂化：**酶解性脂肪坏死释放的脂肪酸与钙结合形成灰白色钙皂。** ★★★★","stars":4},{"file":"01 病理学（细胞和组织的适应与损伤）_精简版.md","line":176,"text":"    - 形态与部位：**主要发生于结缔组织和小血管壁，病变部位出现细丝状、颗粒状或小条块状强嗜酸性无结构物质，可位于心肌间质、肾小球和小动脉。** ★★★★","stars":4},{"file":"01 病理学（细胞和组织的适应与损伤）_精简版.md","line":178,"text":"    - 常见疾病：**常见于免疫性疾病，如风湿病、系统性红斑狼疮、结节性多动脉炎和新月体性肾小球肾炎，也可见于急进型高血压及胃溃疡底部小血管。** ★★★★","stars":4},{"file":"18 病理学（传染病）_精简版.md","line":199,"text":"- **阿米巴肝脓肿多由滋养体经门静脉进入肝形成，常位于肝右叶，内容物为棕褐色果酱样液化坏死物，病灶内炎症反应较轻** ★★★。","stars":3}],"exam_references":[{"code":"2020N31A","chapter":1,"stem":"肾贫血性梗死的组织坏死类型属于","file":"第一章 细胞和组织的适应与损伤.md","lines":[429,435],"historical_caveat":"","note":"来自v2历史核对索引的参考关联；不等于本恢复题完整覆盖原题及全部 const D=window.CH1, Q=D.questions, P=D.course.states, MAIN=P.filter(p=>!p.summary), BY=new Map(P.map(p=>[p.state_id,p]));
const inspect=window.PRACTICE_PREVIEW===true||new URLSearchParams(location.search).get('inspect')==='practice';

let S={view:'chapter',section:D.sections[0].id,item:D.items[0].id,page:MAIN[0].state_id,read:[],seen:[],theme:'light',session:null,archives:[],review:null,readingScroll:0};

let sheet=null,readerReady=false,restoreFocus=null;

const itemBy=id=>D.items.find(i=>i.id===id),sectionBy=id=>D.sections.find(i=>i.id===id),pageItem=id=>D.items.find(i=>i.pages.includes(id));

const addRead=id=>{if(!S.read.includes(id))S.read.push(id)};

function startPractice(redo=false){if(redo&&S.session){S.archives.push(S.session);S.session=null}if(!S.session)S.session=sessionNew();S.review=null;S.view=S.session.lastView==='result'?'result':'practice';render(true)}
function question(){return Q[S.session.index]}
function newAttempt(q,carry=null){const history=S.session.attempts[q.id]||=[];const prior=history.length||S.archives.some(s=>s.attempts[q.id]?.length);const a={id:uid(),kind:prior?'retry':'initial',status:'in_progress',values:carry||{},row:0,rowGrades:{},orders:{},assisted:!!prior||D.review[q.id].some(p=>S.session.exposed.includes(p)),scroll:0,createdAt:new Date().toISOString()};history.push(a);save();return a}
function attempt(q=question()){const h=S.session.attempts[q.id];const a=h?.at(-1)||newAttempt(q);if(a.status==='skipped'){a.status='in_progress';save()}return a}
function order(a,key,values){if(!a.orders[key]){a.orders[key]=shuffle(values);save()}return a.orders[key]}
function exposed(q){for(const p of D.review[q.id])if(!S.session.exposed.includes(p))S.session.exposed.push(p)}
function isFinished(a){return a&&['submitted','revealed','skipped'].includes(a.status)}

function navQuestion(index){S.session.index=Math.max(0,Math.min(Q.length-1,index));S.view='practice';S.session.lastView='practice';S.review=null;render(true)}

function sectionHTML(){const sec=sectionBy(S.section),its=D.items.filter(i=>i.section===sec.id),next=its.find(i=>!doneItem(i));return `<section class="directory-page"><div class="directory-heading"><small>${esc(sec.number)}</small><h1>${esc(sec.title)}</h1><p>本节目录</p></div><div class="section-item-tree">${its.map(i=>{const done=doneItem(i),active=i===next;return `<button class="section-item-row ${active?'is-active':''}" data-action="item" data-id="${i.id}">${dot(done,active)}<span><strong>${esc(i.title)}</strong><small>${done?'已浏览':active?'接下来':i.pages.some(p=>S.seen.includes(p))?'学习中':''}</small></span><span class="row-arrow">›</span></button>`}).join('')}</div><div class="directory-primary-actions">${btn(next?`进入「${esc(next.title)}」`:D.sections.at(-1).id===sec.id?'查看本章完成情况':'进入下一节','continue-section','','primary-course-button')}</div></section>`}
function completionHTML(){const missing=MAIN.filter(p=>!S.read.includes(p.state_id));return `<section class="completion-page"><div class="completion-orbit"><span></span></div><h1>${missing.length?'本章学习进度':'本章学习完成'}</h1><p>${missing.length?`已浏览 ${S.read.filter(id=>!BY.get(id).summary).length}/${MAIN.length} 页；已回看 ${P.filter(p=>p.summary&&S.read.includes(p.state_id)).length}/${P.filter(p=>p.summary).length} 个完整比较。`:'你已完成本章阅读。现在可以检验一下记住了哪些内容。'}</p>${missing.filter(p=>p.summary).map(p=>btn(`查看${esc(p.title)}完整比较`,'completion-review',`data-id="${p.state_id}"`,'question-target')).join('')}${missing.some(p=>!p.summary)?btn('继续学习','continue-learning','','primary-course-button'):!missing.length?btn(S.session?'继续检测':'开始检测','practice','','primary-course-button'):''}${btn('返回本章目录','chapter','','text-course-button')}</section>`}
function choiceButton(value,selected,action,attrs='',disabled=false){return btn(`${selected?'✓ ':''}${esc(value)}`,action,`${attrs} ${disabled?'disabled':''} aria-pressed="${!!selected}"`,'option-button'+(selected?' is-selected':''))}

function footerActions(q,a){return `<div class="question-actions">${btn('回看相关知识','review')}${a.status==='in_progress'?btn('暂时跳过','skip'):btn('重做本题','retry')}${q.type==='comparison_table_select'&&a.status==='submitted'&&!a.correct?btn('只重做错项','retry-wrong'):''}</div>`}
function practiceHTML(){const q=question(),a=attempt(q),d=q.data;let body='';const finished=isFinished(a);const label={'matching':'匹配','keyword_cloze':'关键词回忆','stacked_matrix_select':'逐行多选','comparison_table_select':'对比表格选择','discrimination':'鉴别'}[q.type];
 if(a.status==='skipped'){body=`<p>本题已暂时跳过，已选内容已保留。</p>${btn('继续作答本题','resume-skipped','','question-submit')}${btn('下一题','advance','','text-course-button')}`}
 else if(q.type==='keyword_cloze'){let i=0;const text=esc(d.text).replace(/\{\{\}\}/g,()=>a.status==='revealed'?`<span class="cloze-answer">${esc(d.answers[i++])}</span>`:'<span class="cloze-blank">＿＿＿</span>');body=`<p>先在心中回忆，再查看答案。</p><div class="cloze-text">${text}</div>${btn(a.status==='revealed'?'继续':'查看答案',a.status==='revealed'?'advance':'reveal','','question-submit')}${a.status==='revealed'?'<p>已查看回忆卡，本题不计客观得分。</p>':''}`}
 else if(q.type==='matching'){const rows=d.rows,current=Math.min(a.row,rows.length-1),choices=order(a,'options',d.options),all=rows.every((_,i)=>a.values[i]!==undefined);body=`${Object.keys(a.values).length?`<div class="practice-history" aria-label="待提交对应">${rows.map((r,i)=>a.values[i]===undefined?'':btn(`${esc(r.prompt)} → ${esc(a.values[i])}`,'edit-match',`data-index="${i}" ${finished?'disabled':''}`,'question-target')).join('')}</div>`:''}${!finished?`<p class="practice-meta">当前第 ${current+1}/${rows.length} 项 · ${d.mode==='pair'?'一一对应':'类别可重复使用'}</p><div class="current-prompt">${esc(rows[current].prompt)}</div><div class="option-grid ${choices.some(v=>v.length>9)?'long-choices':''}">${choices.map((v,k)=>choiceButton(v,a.values[current]===v,'match',`data-index="${k}"`,d.mode==='pair'&&Object.entries(a.values).some(([i,x])=>Number(i)!==current&&x===v))).join('')}</div><div class="question-actions">${btn('提交本组','submit',all?'':'disabled','question-submit')}</div>`:objectiveFeedback(q,a)}${finished?btn('继续','advance','','question-submit'):''}`;}
 else if(q.type==='stacked_matrix_select'){const r=d.rows[a.row],checked=a.rowGrades[a.row],selected=a.values[a.row]||[],choices=order(a,'row-'+a.row,r.options);body=`${a.row?`<div class="practice-history">${d.rows.slice(0,a.row).map((r,i)=>`<p>${a.rowGrades[i]?'✓':'需复习'} ${esc(r.prompt)}：${esc(r.answers.join('、'))}</p>`).join('')}</div>`:''}<p class="practice-meta">第 ${a.row+1}/${d.rows.length} 项 · 可多选</p><div class="current-prompt">${esc(r.prompt)}</div><div class="option-grid ${choices.some(v=>v.length>9)?'long-choices':''}">${choices.map((v,k)=>choiceButton(v,selected.includes(v),'matrix',`data-index="${k}"`,checked!==undefined||finished)).join('')}</div>${checked!==undefined?`<div class="question-feedback ${checked?'':'is-review'}" role="status"><strong>${checked?'✓ 本项正确':'本项需复习'}</strong><p>正确选择：${esc(r.answers.join('、'))}</p>${r.answers.some(v=>!selected.includes(v))?`<p>漏选：${esc(r.answers.filter(v=>!selected.includes(v)).join('、'))}</p>`:''}${selected.some(v=>!r.answers.includes(v))?`<p>多选：${esc(selected.filter(v=>!r.answers.includes(v)).join('、'))}</p>`:''}</div>${btn(finished?'继续':'继续下一项',finished?'advance':'matrix-next','','question-submit')}`:btn('确认本项','matrix-submit',selected.length?'':'disabled','question-submit')}`}

}
function resultHTML(){const firsts=Q.map(q=>(S.session.attempts[q.id]||[])[0]);const independent=firsts.filter(a=>a?.status==='submitted'&&!a.assisted&&a.kind==='initial'),correct=independent.filter(a=>a.correct).length;const assisted=firsts.filter(a=>a?.status==='submitted'&&a.assisted),revealed=firsts.filter(a=>a?.status==='revealed');const last=Q.map(q=>S.session.attempts[q.id]?.at(-1));const skipped=last.filter(a=>a?.status==='skipped').length,pending=last.filter(a=>!isFinished(a)).length;const retryCount=Object.values(S.session.attempts).flat().filter(a=>a.kind==='retry').length;return `<section class="result-screen"><div class="practice-meta">第一章 · ${pending?'当前进度':'检测结束'}</div><h1>本次检测表现</h1><dl><div><dt>首次独立客观提交</dt><dd>${independent.length} 题</dd></div><div><dt>整题完全正确</dt><dd>${correct}/${independent.length}${independent.length?' · '+Math.round(correct/independent.length*100)+'%':''}</dd></div><div><dt>提示后练习</dt><dd>${assisted.filter(a=>a.correct).length}/${assisted.length} 题正确</dd></div><div><dt>已查看回忆卡</dt><dd>${revealed.length} 题</dd></div><div><dt>本次跳过 / 待作答</dt><dd>${skipped} / ${pending} 题</dd></div><div><dt>重做尝试</dt><dd>${retryCount} 次</dd></div></dl><p>回忆卡不计客观分；看过相关答案后的作答单独记录。结果只反映本次已测内容。</p>${pending?btn('继续检测','resume-pending','','question-submit'):btn('重新检测本章','redo-session','','question-submit')}<h2>题目记录</h2>${Q.map((q,i)=>{const a=last[i];const status=!a?'待作答':a.status==='revealed'?'已查看回忆卡':a.status==='skipped'?'已跳过':a.status==='in_progress'?'作答中':a.correct?'本题全部正确':'出现错项';return `<article class="result-item"><h3>${i+1}. ${esc(q.title)}</h3><p>${status}${a?.assisted?' · 提示后练习':''}</p><div class="question-actions">${btn(a&&isFinished(a)?'查看本题':'继续作答','goto-question',`data-index="${i}"`)}${btn('回看相关知识','result-review',`data-index="${i}"`)}</div></article>`}).join('')}<p>${pending?'进度已保存，可以稍后继续。':'本轮检测已记录。把出现错项的知识再回顾一遍。'}</p>${btn('返回本章目录','chapter','','text-course-button')}</section>`}
function render(reset=false){document.body.dataset.theme=S.theme;document.getElementById('header-title').textContent=S.view==='chapter'?'本章目录':S.view==='section'?sectionBy(S.section).title:S.view==='reading'?(S.review?'回看知识 · 返回检测':'知识学习'):S.view==='completion'?'本章学习完成':S.view==='result'?'本次检测表现':inspect?'检测预览':'章末检测';document.querySelector('.course-header>[data-action="back"]').setAttribute('aria-label',S.review?'返回检测':'返回上一级');screen.hidden=S.view==='reading';frame.hidden=S.view!=='reading';document.getElementById('footer-cue').textContent=S.view==='reading'?(S.review?'左上角返回检测，保留原题已选内容':'阅读后继续；完整比较可主动回看'):S.view==='practice'?'选择后确认，提交前可以修改':S.view==='chapter'||S.view==='section'?'点击目录进入 · 阅读与检测分别记录':'学习与检测分别记录';if(S.view==='reading'){if(readerReady)frame.contentWindow.postMessage({channel:'chapter01-parent',action:'show',id:S.page,theme:S.theme,scroll:S.readingScroll},'*')}else{const prevScroll=screen.scrollTop;screen.innerHTML=({chapter:chapterHTML,section:sectionHTML,completion:completionHTML,practice:practiceHTML,result:resultHTML}[S.view]||chapterHTML)();screen.scrollTop=reset?0:S.view==='practice'?attempt().scroll||0:prevScroll;}save()}

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const act=b.dataset.action;const q=S.session?question():null,a=S.session?attempt():null;

chapterHTML=function(){return originalChapterHTML().replace(/<div class="directory-primary-actions">[\s\S]*<\/div><\/section>$/,`<div class="directory-primary-actions">${btn(allRead()?'查看学习完成情况':'继续学习','continue-learning','','primary-course-button')}<button class="chapter-practice-entry" data-action="v2-entry"><span><strong>本章检测</strong><small>${S.session?'已处理 '+terminalCount()+' / '+Q.length+' 题组':Q.length+' 题组 · 独立作答'}</small></span><span aria-hidden="true">→</span></button></div></section>`)};
completionHTML=function(){return originalCompletionHTML().replace(/data-action="practice"/g,'data-action="v2-entry"').replace('>开始检测<','>进入本章检测<').replace('>继续检测<','>继续本章检测<')};
function responseHint(q,a){return a.assisted?'<p class="assisted-note">本题已看过相关提示，按提示后练习记录。</p>':''}
function matchFeedback(q,a){return `<div class="question-feedback compact-feedback ${a.correct?'':'is-review'}" role="status"><strong>${a.correct?'✓ 本题答对':'✕ 本题答错'}</strong></div><div class="feedback-relations">${q.data.rows.map((r,i)=>`<div class="feedback-relation ${a.values[i]===r.answer?'correct':'incorrect'}"><span class="relation-status">${a.values[i]===r.answer?'✓ 正确':'✕ 错误'}</span><div><p>${esc(r.prompt)}</p>${a.values[i]===r.answer?`<strong>${esc(r.answer)}</strong>`:`<span class="your-answer">你的选择：${esc(a.values[i])}</span><strong>正确对应：${esc(r.answer)}</strong>`}</div></div>`).join('')}</div>${q.feedback?`<p class="explanation">${esc(q.feedback)}</p>`:''}`}
practiceHTML=function(){
 const q=question(),a=attempt(q),d=q.data,finished=isFinished(a);let content='';
 const progress=`<div class="question-progress" aria-label="第 ${S.session.index+1} 题，共 ${Q.length} 题"><span>${esc(typeNames[q.type])}</span><span><b>${S.session.index+1}</b> / ${Q.length}</span></div><div class="question-track" aria-hidden="true"><i style="width:${(S.session.index+1)/Q.length*100}%"></i></div>`;
 if(a.status==='skipped') content='<div class="skipped-note"><strong>本题已暂时跳过</strong><p>已选内容保留，可以接着作答。</p></div>';
 else if(q.type==='keyword_cloze'){
  let i=0;content=`<div class="recall-passage">${esc(d.text).replace(/\{\{\}\}/g,()=>{const index=i++,visible=a.status==='revealed'||a.revealedBlanks?.includes(index);return visible?`<span class="recall-answer">${esc(d.answers[index])}</span>`:`<button type="button" class="recall-blank" data-action="reveal-blank" data-index="${index}" aria-label="显示第 ${index+1} 个空的答案">&nbsp;</button>`})}</div>${a.status==='revealed'?'<div class="recall-feedback" role="status">答案已全部查看 · 本题不计客观分</div>':''}`;
 }else if(q.type==='matching'){
  const rows=d.rows,idx=Math.min(a.row,rows.length-1),count=Object.keys(a.values).length,choices=order(a,'options',d.options);
  content=finished?matchFeedback(q,a):`<div class="matching-current"><div class="task-counter">第 ${idx+1} / ${rows.length} 项 · 单选</div><div class="current-prompt">${esc(rows[idx].prompt)}</div></div><p class="selection-hint">${d.mode==='pair'?'每个选项限用一次':'选择对应概念，可重复使用'}</p><div class="option-grid matching-options">${choices.map((v,k)=>choiceButton(v,a.values[idx]===v,'match',`data-index="${k}"`,d.mode==='pair'&&Object.entries(a.values).some(([i,x])=>Number(i)!==idx&&x===v))).join('')}</div>${count?`<details class="answer-history"><summary>已选 ${count} / ${rows.length} 项 <span>查看或修改</span></summary><div class="history-scroll">${rows.map((r,i)=>a.values[i]===undefined?'':btn(`<span>${esc(r.prompt)}</span><strong>${esc(a.values[i])}</strong>`,'edit-match',`data-index="${i}"`,'history-choice')).join('')}</div></details>`:''}`;
 }else if(q.type==='stacked_matrix_select'){
  const r=d.rows[a.row],selected=a.values[a.row]||[],graded=a.rowGrades[a.row],choices=order(a,'row-'+a.row,r.options);
  content=`<div class="matching-current"><div class="task-counter">第 ${a.row+1} / ${d.rows.length} 项 · 多选</div><div class="current-prompt">${esc(r.prompt)}</div></div><div class="option-grid matrix-options">${choices.map((v,k)=>choiceButton(v,selected.includes(v),'matrix',`data-index="${k}"`,graded!==undefined||finished)).join('')}</div>${graded!==undefined?`<div class="question-feedback matrix-feedback ${graded?'':'is-review'}" role="status"><strong>${graded?'✓ 回答正确':'✕ 回答错误'}</strong></div>`:''}${a.row?`<details class="answer-history"><summary>已完成 ${a.row} 项 <span>回看</span></summary><div class="history-scroll">${d.rows.slice(0,a.row).map((r,i)=>`<p>${a.rowGrades[i]?'✓':'✕'} ${esc(r.prompt)}<br>${esc(r.answers.join('、'))}</p>`).join('')}</div></details>`:''}`;
 }else if(q.type==='comparison_table_select'){
  content=`<div class="task-instruction">${esc(d.stem)}</div>${finished?`<div class="question-feedback compact-feedback ${a.correct?'':'is-review'}" role="status"><strong>${a.correct?'✓ 本题答对':'✕ 本题答错'}</strong></div>`:''}<div class="table-head">${d.columns.map(c=>`<strong>${esc(c)}</strong>`).join('')}</div><div class="comparison-task">${d.rows.map((r,i)=>`<section class="comparison-row"><h3>${esc(r.dimension)}</h3><div class="comparison-cells">${d.columns.map((col,j)=>{const k=`${i}:${j}`,v=a.values[k],correct=v===r.answers[j];return `<div>${btn(v===undefined?'<span class="choose-placeholder">＋ 选择</span>':esc(v),'table-slot',`data-row="${i}" data-col="${j}" aria-label="${esc(col+'，'+r.dimension+'，'+(v??'待选择'))}" ${finished?'disabled':''}`,'question-target'+(v!==undefined?' is-filled':'')+(finished?(correct?' cell-correct':' cell-incorrect'):''))}${finished?`<span class="feedback-label">${correct?'✓ 正确':`✕ 错误<br>正确答案：${esc(r.answers[j])}`}</span>`:''}</div>`}).join('')}</div></section>`).join('')}</div>${finished&&!a.correct?btn('只重做错项','retry-wrong','','text-course-button'):''}`;
 }else if(q.type==='discrimination'){
  const choices=order(a,'options',d.options);content=`<div class="task-instruction lead-instruction">${esc(d.stem)}</div><p class="selection-hint">选择一个最符合的答案。</p><div class="option-grid long-choices">${choices.map((v,k)=>choiceButton(v,a.values.answer===v,'single',`data-index="${k}"`,finished)).join('')}</div>${finished?objectiveFeedback(q,a):''}`;
 }
 return `<section class="practice-screen redesigned ${q.type==='stacked_matrix_select'?'matrix-question':q.type==='matching'?'matching-question':''}" data-question-id="${q.id}">${progress}<h1 class="question-title">${esc(q.title)}</h1>${content}${finished?responseHint(q,a):''}</section>`;
};
function dockHTML(){
 if(S.view==='intro')return '';
 const q=question(),a=attempt(q),d=q.data;let label='提交答案',action='submit',ready=true,note='';
 if(a.status==='skipped'){label='继续作答本题';action='resume-skipped'}
 else if(a.status==='revealed'||a.status==='submitted'){label='';}
 else if(q.type==='keyword_cloze'){label='查看答案';action='reveal'}
 else if(q.type==='matching'){const n=d.rows.filter((_,i)=>a.values[i]!==undefined).length;label='提交本组';ready=n===d.rows.length;note=`已选 ${n} / ${d.rows.length} 项`}
 else if(q.type==='comparison_table_select'){const total=d.rows.reduce((n,r)=>n+r.answers.length,0),n=Object.keys(a.values).length;label='提交本组';ready=n===total;note=`已填 ${n} / ${total} 格`}
 else if(q.type==='stacked_matrix_select'){if(a.rowGrades[a.row]!==undefined){label='继续下一项';action='matrix-next'}else{label='确认本项';action='matrix-submit';ready=!!a.values[a.row]?.length}}
 else if(q.type==='discrimination'){ready=a.values.answer!==undefined}
 return `${label?`<div class="dock-main">${note?`<span class="dock-hint">${note}</span>`:''}${btn(label,action,ready?'':'disabled','question-submit dock-primary')}</div>`:''}<div class="question-navigation">${btn('上一题','v3-prev',S.session.index===0?'disabled':'','nav-question')}${btn('回看知识','review','','dock-link')}${btn('下一题','v3-next',S.session.index===Q.length-1?'disabled':'','nav-question')}</div>${isFinished(a)?`<div class="finished-actions">${btn('重做本题','retry','','dock-link')}${btn('查看结果','v2-results','','dock-link')}</div>`:''}`;
}

  const choices=a.orders.options;
  screen.querySelectorAll('[data-action="single"]').forEach(b=>{clearSelectionTick(b);const value=choices[+b.dataset.index],right=value===q.data.answer,chosen=value===a.values.answer;if(right||chosen){b.classList.add(right?'explicit-correct':'explicit-wrong');b.insertAdjacentHTML('beforeend',`<span class="answer-verdict">${right?'✓ 正确答案':'✕ 你的选择 · 错误'}</span>`)}});

let questionGesture=null,lastQuestionSwipe=0;
screen.addEventListener('pointerdown',e=>{if(S.view!=='practice'||sheet||!e.isPrimary||(e.pointerType==='mouse'&&e.button!==0))return;questionGesture={id:e.pointerId,x:e.clientX,y:e.clientY,index:S.session.index,locked:false}},{passive:true});
screen.addEventListener('pointermove',e=>{const g=questionGesture;if(!g||g.id!==e.pointerId)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;if(!g.locked&&Math.abs(dy)>18&&Math.abs(dy)>Math.abs(dx)){questionGesture=null;return}if(Math.abs(dx)>16&&Math.abs(dx)>Math.abs(dy)*1.4){g.locked=true;try{screen.setPointerCapture(e.pointerId)}catch(_){}if(e.cancelable)e.preventDefault()}},{passive:false});

 const b=e.target.closest('[data-action="reveal-blank"]');if(!b)return;
 e.stopImmediatePropagation();const q=question(),a=attempt(),i=Number(b.dataset.index);
 if(q.type!=='keyword_cloze'||!Number.isInteger(i)||i<0||i>=q.data.answers.length)return;
 a.revealedBlanks=Array.from(new Set([...(a.revealedBlanks||[]),i]));
 exposed(q);
 if(a.revealedBlanks.length===q.data.answers.length){a.status='revealed';a.revealedAt=new Date().toISOString()}
 save();render();
},true);
</script><script>'use strict';
// Retain source conditions while omitting only generic, duplicated operation instructions.
const chapterPracticeHTML=practiceHTML;
practiceHTML=function(){
 const q=question(),a=attempt(),d=q.data;
 if(q.type!=='sequence_select'){
  let content=chapterPracticeHTML();
  if(['matching','stacked_matrix_select'].includes(q.type)&&!isFinished(a)){
   const generic=['将下列内容与相应概念匹配。','按观察角度，逐行选择相应内容。'];
   if(d.stem&&!generic.includes(d.stem))content=content.replace('</h1>','</h1><p class="source-condition">'+esc(d.stem)+'</p>');
  }
  return content;
 }
 const choices=order(a,'sequence',d.items),values=a.values.sequence||[],finished=isFinished(a);
 const selected=values.map((v,i)=>`<li>${btn(`<span class="sequence-number">${i+1}</span><span>${esc(v)}</span>`,'sequence-remove',`data-index="${i}" ${finished?'disabled':''}`,'sequence-picked')}</li>`).join('');
 const feedback=finished?`<div class="question-feedback compact-feedback ${a.correct?'':'is-review'}" role="status"><strong>${a.correct?'✓ 回答正确':'✕ 回答错误'}</strong></div>${a.correct?'':`<p class="selection-hint">正确顺序</p><ol class="correct-sequence">${d.correct_order.map(v=>`<li>${esc(v)}</li>`).join('')}</ol>`}`:'';
 return `<section class="practice-screen redesigned sequence-question" data-question-id="${q.id}"><h1 class="question-title">${esc(q.title)}</h1><p class="source-condition">${esc(d.stem)}</p>${values.length?`<ol class="sequence-picked-list">${selected}</ol>`:''}${finished?feedback:`<p class="selection-hint">依次点击选项；点击已选项可撤回</p><div class="option-grid long-choices">${choices.map((v,i)=>values.includes(v)?'':choiceButton(v,false,'sequence-add',`data-index="${i}"`)).join('')}</div>`}</section>`;
};
const chapterDockHTML=dockHTML;
dockHTML=function(){
 if(S.view==='practice'&&question().type==='sequence_select'){
  const a=attempt(),ready=!isFinished(a)&&(a.values.sequence||[]).length===question().data.items.length;
  return `<div class="two-actions">${btn('回顾','review','','review-primary')}${btn('提交','submit',ready?'':'disabled','question-submit dock-primary')}</div>`;
 }
 return chapterDockHTML();
};
const chapterSubmit=submit;
submit=function(){
 if(question().type!=='sequence_select')return chapterSubmit();
 const q=question(),a=attempt(),values=a.values.sequence||[];
 if(isFinished(a)||values.length!==q.data.items.length)return;
 a.correct=q.data.correct_order.every((v,i)=>v===values[i]);a.status='submitted';a.submittedAt=new Date().toISOString();exposed(q);save();render();
};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
 if(['sequence-add','sequence-remove'].includes(b.dataset.action)){
  e.stopImmediatePropagation();const a=attempt();if(isFinished(a))return;const values=a.values.sequence||=[];
  if(b.dataset.action==='sequence-add'){const v=a.orders.sequence[+b.dataset.index];if(!values.includes(v))values.push(v)}else values.splice(+b.dataset.index,1);
  save();render();
 }
 if(b.dataset.action==='back'&&S.view==='chapter'){e.stopImmediatePropagation();location.href='../index.html'}
},true);
const chapterRender=render;
render=function(reset=false){chapterRender(reset);if(S.view==='chapter'){screen.querySelector('.directory-heading')?.insertAdjacentHTML('beforeend','<a class="all-chapters-link" href="../index.html">全部章节</a>')}};
// A chapter topic opens its reading pages directly, without an intermediate directory.
const topicItems=D.sections.map(sec=>({id:'topic-'+sec.id,title:sec.title,section:sec.id,pages:D.items.filter(i=>i.section===sec.id).flatMap(i=>i.pages)}));
D.items=topicItems;
const currentTopic=pageItem(S.page)||D.items[0];S.item=currentTopic.id;S.section=currentTopic.section;
const directTopicRender=render;
render=function(reset=false){if(S.view==='section')S.view='chapter';directTopicRender(reset)};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action="section"]');if(!b)return;
 e.stopImmediatePropagation();const item=D.items.find(i=>i.section===b.dataset.id);
 S.item=item.id;S.section=item.section;enterPage(item.pages[0]);
},true);
render(true);
</script><script>// Approved feedback: original renderers grade; local verdicts shown once.
(()=>{

 const previousRender=render;
 render=function(reset=false){
  previousRender(reset);
  if(S.view!=='practice')return;
  const q=question(),a=attempt();
  const isMatrix=q.type==='stacked_matrix_select';
  const hasLocalVerdicts=['discrimination','matching','comparison_table_select'].includes(q.type)&&a.status==='submitted';
  if(!hasLocalVerdicts&&!(isMatrix&&a.rowGrades[a.row]!==undefined))return;
  const feedback=screen.querySelector('.question-feedback');
  if(!feedback)return;
  // Keep controls out of the removed outcome box. Matrix rows still advance.
  const next=feedback.querySelector('[data-action="matrix-next"]');
  if(next){next.style.marginLeft='auto';feedback.before(next)}
  // Matching explanations are already outside the outcome box. Only the
  // single-choice renderer puts its supplementary explanation inside it.
  if(q.type==='discrimination'&&q.feedback){
   const explanation=document.createElement('p');
   explanation.className='explanation feedback-explanation';
   explanation.textContent=q.feedback;
   feedback.replaceWith(explanation);
  }else feedback.remove();
  const local=screen.querySelector(isMatrix?'.matrix-options':q.type==='matching'?'.feedback-relations':q.type==='comparison_table_select'?'.comparison-task':'.long-choices');
  if(local){local.setAttribute('role','status');local.setAttribute('aria-live','polite')}
 };
 render(true);
})();
</script></body></html>
